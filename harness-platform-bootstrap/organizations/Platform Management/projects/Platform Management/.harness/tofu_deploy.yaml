pipeline:
  name: Tofu Deploy
  identifier: tofu_deploy
  projectIdentifier: platform_management
  orgIdentifier: platform_management
  tags: {}
  allowStageExecutions: true
  properties:
    ci:
      codebase:
        connectorRef: org.platform_configs
        repoName: hsf-custom-harness-template-library
        build: <+input>
  variables:
    - name: TF_REPO
      type: String
      description: Git repo name containing Terraform config
      required: true
      value: <+input>.default(hsf-custom-harness-template-library)
    - name: TF_BRANCH
      type: String
      description: Branch to fetch Terraform config from
      required: true
      value: <+input>.default(main)
    - name: entrypoint
      type: String
      description: Entrypoint folder to run Terraform against
      required: true
      value: <+input>.allowedValues(harness-platform-bootstrap,harness-organization,harness-project,harness-platform-setup)
    - name: TF_INFRA_NAME
      type: String
      description: Short infra name used in provisioner ID (e.g. vpc, eks-cluster)
      required: true
      value: <+input>
    - name: TF_ENV
      type: String
      description: Target environment
      required: true
      value: <+input>.default(dev).allowedValues(dev,staging,prod)
    - name: gcs_bucket
      type: String
      description: GCS bucket name for remote state storage
      required: true
      value: <+input>
    - name: gcp_project
      type: String
      description: GCP project ID used for OIDC authentication and GCS backend
      required: true
      value: <+input>
    - name: gcp_pool_id
      type: String
      description: GCP Workload Identity Pool ID for OIDC authentication
      required: true
      value: <+input>
    - name: gcp_provider_id
      type: String
      description: GCP Workload Identity Provider ID for OIDC authentication
      required: true
      value: <+input>
    - name: gcp_service_account_email
      type: String
      description: GCP service account email for OIDC token exchange
      required: true
      value: <+input>
    - name: TF_VARS_FILE
      type: String
      description: Path to .tfvars file within the repo (e.g. terraform/envs/dev.tfvars). Follows convention entrypoint/envs/TF_ENV.tfvars by default.
      required: false
      value: <+input>.default(<+pipeline.variables.entrypoint>/envs/<+pipeline.variables.TF_ENV>.tfvars)
  stages:
    - stage:
        name: Terraform Validation
        identifier: validate_stage
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Terraform Version Check
                  identifier: tf_version_check
                  spec:
                    shell: Sh
                    command: |
                      echo "=== Tool Versions ==="
                      terraform version || { echo "ERROR: terraform not found on PATH"; exit 1; }
                      git --version     || { echo "ERROR: git not found on PATH"; exit 1; }
                      echo "=== Terraform Version Enforcement ==="
                      TF_VERSION=$(terraform version -json | python3 -c "import sys,json; print(json.load(sys.stdin)['terraform_version'])")
                      REQUIRED_MINOR="1.5"
                      echo "Detected: $TF_VERSION — Required minimum: $REQUIRED_MINOR"
                      # Uncomment to enforce minimum version:
                      # python3 -c "
                      # import sys
                      # v = '$TF_VERSION'.split('.')
                      # r = '$REQUIRED_MINOR'.split('.')
                      # sys.exit(0 if (int(v[0]),int(v[1])) >= (int(r[0]),int(r[1])) else 1)
                      # " || { echo "ERROR: Terraform version too old"; exit 1; }
                      echo "Version check passed"
                  timeout: 2m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsFailure
              - stepGroup:
                  name: Validation
                  identifier: Validation
                  steps:
                    - parallel:
                        - step:
                            type: Run
                            name: Terraform Format Check
                            identifier: tf_fmt
                            spec:
                              shell: Sh
                              command: |
                                terraform fmt -check -recursive <+pipeline.variables.entrypoint>
                            timeout: 5m
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - AllErrors
                                  action:
                                    type: MarkAsFailure
                        - step:
                            type: Checkov
                            name: Checkov Scan
                            identifier: Checkov_Scan
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: repository
                                detection: auto
                              advanced:
                                log:
                                  level: info
                        - step:
                            type: Run
                            name: Terraform Init
                            identifier: tf_init
                            spec:
                              shell: Sh
                              command: |
                                cd <+pipeline.variables.entrypoint>
                                terraform init -backend=false
                            timeout: 5m
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - AllErrors
                                  action:
                                    type: MarkAsFailure
                    - step:
                        type: Run
                        name: Terraform Validate
                        identifier: tf_validate
                        spec:
                          shell: Sh
                          command: |-
                            cd <+pipeline.variables.entrypoint>
                            terraform validate
                        timeout: 5m
                        failureStrategies:
                          - onFailure:
                              errors:
                                - AllErrors
                              action:
                                type: MarkAsFailure
                            when:
                              stageStatus: All
                              condition: <+execution.steps.Validation.steps.tf_init.status> == "SUCCEEDED"
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsFailure
          caching:
            enabled: false
            paths: []
          buildIntelligence:
            enabled: false
        properties:
          ci:
            codebase:
              connectorRef: org.platform_configs
              repoName: <+pipeline.variables.TF_REPO>
              build:
                type: branch
                spec:
                  branch: <+pipeline.variables.TF_BRANCH>
        description: ""
    - stage:
        name: Terraform Execution
        identifier: plan_apply_stage
        description: Plan → Approve → Apply
        type: Custom
        tags: {}
        spec:
          execution:
            steps:
              - step:
                  type: Queue
                  name: Concurrency Lock
                  identifier: concurrency_lock
                  spec:
                    key: <+pipeline.variables.TF_INFRA_NAME>_<+pipeline.variables.TF_ENV>
                    scope: Pipeline
                  timeout: 10m
              - step:
                  name: Terraform Plan
                  identifier: tf_plan
                  type: TerraformPlan
                  spec:
                    provisionerIdentifier: <+pipeline.variables.TF_INFRA_NAME>_<+pipeline.variables.TF_ENV>
                    secretManagerRef: harnessSecretManager
                    configuration:
                      command: Apply
                      configFiles:
                        store:
                          type: Github
                          spec:
                            connectorRef: org.platform_configs
                            repoName: <+pipeline.variables.TF_REPO>
                            gitFetchType: Branch
                            branch: <+pipeline.variables.TF_BRANCH>
                            folderPath: <+pipeline.variables.entrypoint>
                      varFiles:
                        - varFile:
                            type: Remote
                            identifier: tf_vars_file
                            spec:
                              store:
                                type: Github
                                spec:
                                  connectorRef: org.platform_configs
                                  repoName: <+pipeline.variables.TF_REPO>
                                  gitFetchType: Branch
                                  branch: <+pipeline.variables.TF_BRANCH>
                                  paths:
                                    - <+pipeline.variables.TF_VARS_FILE>
                      environmentVariables:
                        - name: TF_VAR_environment
                          value: <+pipeline.variables.TF_ENV>
                          type: String
                      backendConfig:
                        type: Inline
                        spec:
                          content: |-
                            bucket = "<+pipeline.variables.gcs_bucket>"
                            prefix = "<+pipeline.variables.TF_INFRA_NAME>/<+pipeline.variables.TF_ENV>"
                      skipRefreshCommand: false
                      exportTerraformPlanJson: true
                    providerCredential:
                      type: Gcp
                      spec:
                        connectorRef: org.harness_gcp_oidc
                        project: <+pipeline.variables.gcp_project>
                  timeout: 15m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsFailure
              - step:
                  name: Plan Review Approval
                  identifier: plan_review_approval
                  type: HarnessApproval
                  spec:
                    approvalMessage: |-
                      *Terraform Plan Review Required*

                      Infra      : <+pipeline.variables.TF_INFRA_NAME>
                      Env        : <+pipeline.variables.TF_ENV>
                      Branch     : <+pipeline.variables.TF_BRANCH>
                      Folder     : <+pipeline.variables.entrypoint>
                      Vars File  : <+pipeline.variables.TF_VARS_FILE>
                      GCS Bucket : <+pipeline.variables.gcs_bucket>

                      Review the plan output above before approving.
                      Pipeline: <+pipeline.executionUrl>
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                  timeout: 1d
              - step:
                  name: Terraform Apply
                  identifier: tf_apply
                  type: TerraformApply
                  spec:
                    provisionerIdentifier: <+pipeline.variables.TF_INFRA_NAME>_<+pipeline.variables.TF_ENV>
                    configuration:
                      type: InheritFromPlan
                    providerCredential:
                      type: Gcp
                      spec:
                        connectorRef: org.harness_gcp_oidc
                        project: <+pipeline.variables.gcp_project>
                  timeout: 20m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsFailure
              - step:
                  type: ShellScript
                  name: Terraform Outputs
                  identifier: tf_outputs
                  when:
                    stageStatus: Success
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=== Apply Complete ==="
                          echo "Infra      : <+pipeline.variables.TF_INFRA_NAME>"
                          echo "Env        : <+pipeline.variables.TF_ENV>"
                          echo "GCS Bucket : <+pipeline.variables.gcs_bucket>"
                          echo "Vars File  : <+pipeline.variables.TF_VARS_FILE>"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsFailure
          failureStrategies:
            - onFailure:
                errors:
                  - AllErrors
                action:
                  type: MarkAsFailure
