pipeline:
  name: Tofu Deploy
  identifier: tofu_deploy
  projectIdentifier: platform_management
  orgIdentifier: platform_management
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: <+input>
        repoName: hsf-custom-harness-template-library
        build: <+input>
  variables:
    - name: tofu_action
      type: String
      description: tofu action to execute
      required: true
      value: <+input>.allowedValues(plan,apply,destroy)
    - name: gcs_bucket
      type: String
      description: GCS bucket name for tofu remote state storage
      required: true
      value: <+input>
    - name: gcp_project
      type: String
      description: GCP project ID (numeric or string) used for OIDC token exchange and GCS backend
      required: true
      value: <+input>
    - name: gcp_pool_id
      type: String
      description: GCP Workload Identity Pool ID for OIDC authentication
      required: true
      value: <+input>
    - name: gcp_provider_id
      type: String
      description: GCP Workload Identity Provider ID for OIDC authentication
      required: true
      value: <+input>
    - name: gcp_service_account_email
      type: String
      description: GCP service account email for OIDC token exchange
      required: true
      value: <+input>
    - name: organization_name
      type: String
      description: Organization name to manage. Used for org deployments and for existing-org lookup in project-only deployments.
      required: false
      value: <+input>
    - name: project_name
      type: String
      description: Project name to create when create_project is true.
      required: false
      value: <+input>
    - name: create_organization
      type: String
      description: Set true to deploy the organization module and any discovered projects in that org config.
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: create_project
      type: String
      description: Set true to deploy only the project module against an existing organization.
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: create_account
      type: String
      description: Set true to deploy account-level resources through the harness-platform-setup module from the root deployment entrypoint.
      required: false
      value: <+input>.default(false).allowedValues(true,false)
    - name: platform_configs_repo_name
      type: String
      description: Platform configs repo to clone for org/project overrides (leave empty to use template defaults only)
      required: false
      value: <+input>
    - name: platform_configs_branch
      type: String
      description: Branch for the platform-configs repo when using the git-driven approach
      required: false
      value: <+input>.default(main)
  stages:
    - stage:
        name: tofu Plan
        identifier: tofu_plan
        description: Clone repos and run tofu plan
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: GitClone
                  name: Clone Platform Configs
                  identifier: clone_platform_configs_plan
                  spec:
                    connectorRef: org.platform_configs
                    repoName: <+pipeline.variables.platform_configs_repo_name>
                    build:
                      type: branch
                      spec:
                        branch: <+pipeline.variables.platform_configs_branch>
                    cloneDirectory: /harness/platform-configs/<+pipeline.variables.platform_configs_repo_name>
                  timeout: 10m
                  when:
                    stageStatus: Success
                    condition: '<+pipeline.variables.platform_configs_repo_name> != ""'
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
              - step:
                  type: Plugin
                  name: GCP OIDC Token
                  identifier: gcp_oidc_token_plan
                  spec:
                    connectorRef: account.harnessImage
                    image: plugins/gcp-oidc
                    settings:
                      project_id: <+pipeline.variables.gcp_project>
                      pool_id: <+pipeline.variables.gcp_pool_id>
                      provider_id: <+pipeline.variables.gcp_provider_id>
                      service_account_email_id: <+pipeline.variables.gcp_service_account_email>
                      duration: 3600
                      create_application_credentials_file: false
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
              - step:
                  type: Run
                  name: tofu Init and Plan
                  identifier: tofu_init_plan
                  spec:
                    connectorRef: account.harnessImage
                    image: ghcr.io/opentofu/opentofu:latest
                    shell: Sh
                    command: |
                      set -e
                      cd /harness/harness-platfom-deployment

                      # Use platform-configs overrides if the repo was cloned, else use template defaults
                      if [ -d "/harness/platform-configs/<+pipeline.variables.platform_configs_repo_name>" ]; then
                        export TF_VAR_configs_relative_path="../platform-configs/<+pipeline.variables.platform_configs_repo_name>"
                      fi

                      ORG_STATE_KEY=$(printf '%s' "<+pipeline.variables.organization_name>" | tr ' -' '_')
                      PROJECT_TARGET="<+pipeline.variables.project_name>"
                      PROJECT_STATE_KEY=$(printf '%s' "${PROJECT_TARGET}" | tr ' -' '_')

                      SELECTED_COUNT=0
                      for FLAG in "<+pipeline.variables.create_account>" "<+pipeline.variables.create_organization>" "<+pipeline.variables.create_project>"; do
                        if [ "${FLAG}" = "true" ]; then
                          SELECTED_COUNT=$((SELECTED_COUNT + 1))
                        fi
                      done

                      if [ "${SELECTED_COUNT}" -ne 1 ]; then
                        echo "Exactly one deployment mode must be selected: create_account, create_organization, or create_project."
                        exit 1
                      fi

                      if [ "<+pipeline.variables.create_account>" = "true" ]; then
                        STATE_PREFIX="harness/account/platform-setup"
                      elif [ "<+pipeline.variables.create_project>" = "true" ]; then
                        STATE_PREFIX="harness/projects/${ORG_STATE_KEY}/${PROJECT_STATE_KEY}"
                      else
                        STATE_PREFIX="harness/orgs/${ORG_STATE_KEY}"
                      fi

                      tofu init \
                        -backend-config="bucket=<+pipeline.variables.gcs_bucket>" \
                        -backend-config="prefix=${STATE_PREFIX}"

                      if [ "<+pipeline.variables.tofu_action>" = "destroy" ]; then
                        tofu plan -destroy
                      else
                        tofu plan
                      fi
                    envVariables:
                      HARNESS_PLATFORM_API_KEY: <+secrets.getValue("account.harness_platform_api_key")>
                      HARNESS_ACCOUNT_ID: <+account.identifier>
                      GOOGLE_OAUTH_ACCESS_TOKEN: <+steps.gcp_oidc_token_plan.output.outputVariables.GCLOUD_ACCESS_TOKEN>
                      TF_VAR_harness_platform_account: <+account.identifier>
                      TF_VAR_organization_name: <+pipeline.variables.organization_name>
                      TF_VAR_project_name: <+pipeline.variables.project_name>
                      TF_VAR_create_account: <+pipeline.variables.create_account>
                      TF_VAR_create_organization: <+pipeline.variables.create_organization>
                      TF_VAR_create_project: <+pipeline.variables.create_project>
                  timeout: 30m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
    - stage:
        name: Approval
        identifier: approval_gate
        description: Manual approval required before tofu apply or destroy
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Approve tofu Apply
                  identifier: approve_tofu_apply
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Please review the tofu plan before proceeding.

                        Action            : <+pipeline.variables.tofu_action>
                        Organization      : <+pipeline.variables.organization_name>
                        Project           : <+pipeline.variables.project_name>
                        Create Account    : <+pipeline.variables.create_account>
                        Create Org        : <+pipeline.variables.create_organization>
                        Create Project    : <+pipeline.variables.create_project>

                      Review the plan output in Stage 1 (tofu Plan) and approve only
                      if the changes are expected and safe to apply.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    approverInputs: []
        when:
          pipelineStatus: Success
          condition: '<+pipeline.variables.tofu_action> != "plan"'
    - stage:
        name: tofu Apply
        identifier: tofu_apply
        description: Clone repos and run tofu apply or destroy
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: GitClone
                  name: Clone Platform Configs
                  identifier: clone_platform_configs_apply
                  spec:
                    connectorRef: org.platform_configs
                    repoName: <+pipeline.variables.platform_configs_repo_name>
                    build:
                      type: branch
                      spec:
                        branch: <+pipeline.variables.platform_configs_branch>
                    cloneDirectory: /harness/platform-configs/<+pipeline.variables.platform_configs_repo_name>
                  timeout: 10m
                  when:
                    stageStatus: Success
                    condition: '<+pipeline.variables.platform_configs_repo_name> != ""'
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
              - step:
                  type: Plugin
                  name: GCP OIDC Token
                  identifier: gcp_oidc_token_apply
                  spec:
                    connectorRef: account.harnessImage
                    image: plugins/gcp-oidc
                    settings:
                      project_id: <+pipeline.variables.gcp_project>
                      pool_id: <+pipeline.variables.gcp_pool_id>
                      provider_id: <+pipeline.variables.gcp_provider_id>
                      service_account_email_id: <+pipeline.variables.gcp_service_account_email>
                      duration: 3600
                      create_application_credentials_file: false
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
              - step:
                  type: Run
                  name: tofu Apply
                  identifier: tofu_apply_step
                  spec:
                    connectorRef: account.harnessImage
                    image: ghcr.io/opentofu/opentofu:latest
                    shell: Sh
                    command: |
                      set -e
                      cd /harness/harness-platfom-deployment

                      # Use platform-configs overrides if the repo was cloned, else use template defaults
                      if [ -d "/harness/platform-configs/<+pipeline.variables.platform_configs_repo_name>" ]; then
                        export TF_VAR_configs_relative_path="../platform-configs/<+pipeline.variables.platform_configs_repo_name>"
                      fi

                      ORG_STATE_KEY=$(printf '%s' "<+pipeline.variables.organization_name>" | tr ' -' '_')
                      PROJECT_TARGET="<+pipeline.variables.project_name>"
                      PROJECT_STATE_KEY=$(printf '%s' "${PROJECT_TARGET}" | tr ' -' '_')

                      SELECTED_COUNT=0
                      for FLAG in "<+pipeline.variables.create_account>" "<+pipeline.variables.create_organization>" "<+pipeline.variables.create_project>"; do
                        if [ "${FLAG}" = "true" ]; then
                          SELECTED_COUNT=$((SELECTED_COUNT + 1))
                        fi
                      done

                      if [ "${SELECTED_COUNT}" -ne 1 ]; then
                        echo "Exactly one deployment mode must be selected: create_account, create_organization, or create_project."
                        exit 1
                      fi

                      if [ "<+pipeline.variables.create_account>" = "true" ]; then
                        STATE_PREFIX="harness/account/platform-setup"
                      elif [ "<+pipeline.variables.create_project>" = "true" ]; then
                        STATE_PREFIX="harness/projects/${ORG_STATE_KEY}/${PROJECT_STATE_KEY}"
                      else
                        STATE_PREFIX="harness/orgs/${ORG_STATE_KEY}"
                      fi

                      tofu init \
                        -backend-config="bucket=<+pipeline.variables.gcs_bucket>" \
                        -backend-config="prefix=${STATE_PREFIX}"

                      if [ "<+pipeline.variables.tofu_action>" = "destroy" ]; then
                        tofu destroy -auto-approve
                      else
                        tofu apply -auto-approve
                      fi
                    envVariables:
                      HARNESS_PLATFORM_API_KEY: <+secrets.getValue("account.harness_platform_api_key")>
                      HARNESS_ACCOUNT_ID: <+account.identifier>
                      GOOGLE_OAUTH_ACCESS_TOKEN: <+steps.gcp_oidc_token_apply.output.outputVariables.GCLOUD_ACCESS_TOKEN>
                      TF_VAR_harness_platform_account: <+account.identifier>
                      TF_VAR_organization_name: <+pipeline.variables.organization_name>
                      TF_VAR_project_name: <+pipeline.variables.project_name>
                      TF_VAR_create_account: <+pipeline.variables.create_account>
                      TF_VAR_create_organization: <+pipeline.variables.create_organization>
                      TF_VAR_create_project: <+pipeline.variables.create_project>
                  timeout: 60m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
        when:
          pipelineStatus: Success
          condition: '<+pipeline.variables.tofu_action> != "plan"'
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
